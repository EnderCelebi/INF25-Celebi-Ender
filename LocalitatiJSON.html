<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON</title>
    <script src="ScriptJSON.js"></script>
</head>
<body>
    <ul id="L1"></ul>
    <ul id="L2"></ul>


    <script>
        function afisareLocalitati(localitati, id){
            const parinte = document.getElementById(id);
            localitati.forEach(localitate => {
                if(localitate.print == false)
                    return;
                const el = document.createElement("li");
                el.innerText = `${localitate.name} lat:${localitate.lat} lon:${localitate.lon}`;
                parinte.appendChild(el)
            });
        }

        fetchJson("api/api/localitati.json", afisareLocalitati, "L1");
        XHRJson("api/api/localitati.json", afisareLocalitati, "L2");
    </script>
</body>
</html>
