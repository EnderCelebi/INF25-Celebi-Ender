<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML v3</title>
    <script src="ScriptXML.js"></script>
</head>
<body>
    <ul id="L1"></ul>
    <ul id="L2"></ul>


    <script>
        function afisareLocalitati(localitati, id){
            const parinte = document.getElementById(id);
            localitati.querySelectorAll("localitate>name").forEach(localitate => {
                if(localitate.getAttribute("print") == "false")
                    return;
                const el = document.createElement("li");
                el.innerText = `${localitate.innerHTML} lat:${localitate.getAttribute("lat")} lon:${localitate.getAttribute("lon")}`;
                parinte.appendChild(el)
            });
        }

        XhrRequest("api/api/localitati-v3.xml", afisareLocalitati, "L1");
        FetchXml("api/api/localitati-v3.xml", afisareLocalitati, "L2");
    </script>
</body>
</html>
